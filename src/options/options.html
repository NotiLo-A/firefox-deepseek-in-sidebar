<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="settings-container">
      <div
        id="feedback"
        class="notification"
        style="display: none"
        role="alert"
      ></div>

      <form>
        <div class="field">
          <label for="shortcut">Keyboard Shortcut</label>
          <input
            type="text"
            id="shortcut"
            placeholder="Alt+Shift+D"
            aria-describedby="shortcut-help"
          />
          <small id="shortcut-help" class="help">
            Use combinations like Ctrl+Shift+Key, Alt+Shift+Key, etc.
          </small>
        </div>

        <div class="buttons">
          <button type="button" id="update" class="btn-primary">Save</button>
          <button type="button" id="reset" class="btn-secondary">
            Reset to Default
          </button>
        </div>
      </form>
    </div>

    <script src="options.js"></script>
  </body>
</html>
